 dir="ltr">Move 1 of 3 allowed items in 1978, see it later. No hidden-spot gating.</p><span class="pill">ادخل مشهدًا</span> <span class="pill">≈ 5 د</span></div><div class="box"><p>1978: <button onclick="mv('كرسي')">ضع كرسياً بجانب النافذة</button><button onclick="mv('مصباح')">انقل مصباحاً</button><button onclick="mv('سجادة')">اسحب سجادة</button></p><button onclick="go04()">مصعد → 2004</button> <button onclick="goNow()">مصعد → الليلة</button><div id="msg"></div><div id="map" style="font-size:13px"></div></div><div class="box"><a href="./index.html"><button class="ghost">كل التجارب</button></a> <button class="ghost" onclick="location.reload()">إعادة</button> <span id="nx"></span></div></div><script>var moves=[];function mv(x){if(moves.length>=3){document.getElementById('msg').textContent='3 أشياء فقط';return;}moves.push({w:x,when:'1978'});document.getElementById('map').textContent='خريطة: '+moves.map(function(m){return m.w+'@'+m.when}).join('، ');}function go04(){document.getElementById('msg').textContent=moves.length?('2004: '+moves[0].w+' ما زال هنا، عليه غبار ✔'):'2004: البهو فارغ';}function goNow(){document.getElementById('msg').textContent=moves.length?('الليلة: '+moves[0].w+' بجانب النافذة — لافتة صغيرة تذكرك ✔'):'الليلة: لا أثر';}
