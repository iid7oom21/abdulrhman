<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دقيقة التحميض · آخر الليل</title><meta name="description" content="صورة تدريب: نافذة ساطعة ووجه دمية في الظل. غيّر زمن الورقة ومرّر قناعاً وثبّت نسختين للمقارنة."><style>body{margin:0;background:#10141a;color:#f2e9d8;font-family:system-ui,Tahoma,Arial}.wrap{max-width:680px;margin:auto;padding:16px}a.back{color:#ffd27a;text-decoration:none;font-size:14px}.box{background:#1c222b;border:1px solid #4a3f2a;border-radius:14px;padding:16px;margin-top:12px;box-shadow:0 0 24px #0008}button{background:#ffd27a;border:0;border-radius:10px;padding:12px 16px;font-size:16px;margin:4px;cursor:pointer;color:#221a08}button.ghost{background:#2b3442;color:#fff}button:disabled{opacity:.4}#msg{min-height:28px;color:#ffd27a;margin-top:8px}.hero{border-radius:14px;padding:18px;background:linear-gradient(135deg,#0e2a3a,#3a2a12);border:1px solid #8a6f3a}.art{font-size:44px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.card{background:#1c222b;border:1px solid #4a3f2a;border-radius:12px;padding:12px;color:#f2e9d8;text-decoration:none}.card small{opacity:.7}input,select{padding:10px;border-radius:8px;margin:4px}input[type=range]{width:100%}.slot{min-height:48px;border:2px dashed #776;padding:8px;border-radius:10px;margin:6px 0}.pill{display:inline-block;background:#2b3442;border-radius:20px;padding:6px 12px;margin:2px;font-size:14px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #4a3f2a;padding:6px;font-size:14px}</style></head><body><div class="wrap"><a class="back" href="./index.html">→ آخر الليل · كل التجارب</a><div class="hero"><div class='art'>🌒</div><h1>دقيقة التحميض</h1><p style="opacity:.8" lang="en" dir="ltr">One developing minute</p><p>صورة تدريب: نافذة ساطعة ووجه دمية في الظل. غيّر زمن الورقة ومرّر قناعاً وثبّت نسختين للمقارنة.</p><p style="opacity:.7" lang="en" dir="ltr">Change paper time, mask one region, pin two versions. Details computed from both regions.</p><span class="pill">شغّل المحاكاة</span> <span class="pill">≈ 5 د</span></div><div class="box"><label>زمن الورقة <input type="range" id="e" value="50"></label><label>قناع الظل <input type="range" id="m" value="50"></label><div id="ph" style="height:90px;border-radius:10px"></div><button onclick="pin()">ثبّت نسخة للمقارنة</button> <button class="ghost" onclick="dl()">تنزيل الطبعة</button><div id="msg"></div><div id="pins"></div></div><div class="box"><a href="./index.html"><button class="ghost">كل التجارب</button></a> <button class="ghost" onclick="location.reload()">إعادة</button> <span id="nx"></span></div></div><script>function up(){var e=+document.getElementById('e').value,m=+document.getElementById('m').value;var d=document.getElementById('ph');d.style.background='linear-gradient(90deg,#fff '+e+'%,#222 '+e+'%)';d.style.filter='brightness('+(0.6+m/90)+')';var win=Math.max(0,100-e),face=Math.max(0,m-10);document.getElementById('msg').textContent='تفاصيل النافذة '+win+'% | تفاصيل الوجه '+face+'%';}document.querySelectorAll('input').forEach(function(i){i.oninput=up});up();function pin(){var d=document.createElement('div');d.className='pill';d.textContent='نسخة '+document.getElementById('e').value+'/'+document.getElementById('m').value;document.getElementById('pins').appendChild(d);}function dl(){var c=document.createElement('canvas');c.width=300;c.height=120;var x=c.getContext('2d');x.fillStyle='#333';x.fillRect(0,0,300,120);x.fillStyle='#fff';x.fillRect(0,0,document.getElementById('e').value*3,120);var a=document.createElement('a');a.download='print.png';a.href=c.toDataURL();a.click();}
var ORDER=["station-shadow","reel-run","last-minute-auction","lost-and-found","dome-sky","echo-two","echo-last-seat","darkroom-minute","weightless-cam","tide-harbor","fabric-wind","director-sentence","reading-actor","city-radio","puzzle-owner","replay-caller","memory-lift","seven-windows","curtain-party","sound-museum","time-door","three-evening","my-notebook","festival-chair","idea-to-studio","dialogue-preview","episode-ends","behind-frame","coast-map","night-tests"];
(function(){var i=ORDER.indexOf("darkroom-minute");var n=ORDER[(i+1)%ORDER.length];document.getElementById('nx').innerHTML='<button onclick="location.href=\'./'+n+'.html\'">التالي →</button>';})();</script></body></html>
