<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ساعي المطر · RAVEN</title><style>
*{box-sizing:border-box}body{margin:0;background:#111b2b;color:#f4e7cd;font:17px/1.7 system-ui,sans-serif}main{max-width:920px;margin:auto;padding:20px}header,nav,.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}a{color:#f3c578}button,select{font:inherit;min-height:44px;border:1px solid #8c9aac;border-radius:8px;padding:8px 14px;background:#24354b;color:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffcd75;outline-offset:3px}canvas{display:block;width:100%;height:auto;background:#192b44;border:1px solid #8995a5;border-radius:12px}section{margin-top:20px}label{display:grid;gap:5px;margin:12px 0}input{max-width:100%;min-height:44px}#board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;direction:ltr;margin:12px 0}#board button{padding:4px;min-height:54px;font-size:15px}#board [aria-current=true]{outline:3px solid #ffcf7b;background:#425778}#board .wall{background:#36333b}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.panel{border:3px solid #171717;background:#eee6d6;color:#151515;padding:10px;min-width:0}.panel p{overflow-wrap:anywhere}.panel button{font-size:14px;width:100%;padding:5px}.ink{height:130px;background:repeating-linear-gradient(110deg,#e3dccf 0 8px,#cdc5b7 9px 10px);display:grid;place-items:center;font-size:44px;color:#111}#status{min-height:3em}small{display:block;color:#bfcbd8}[hidden]{display:none!important}@media(max-width:500px){main{padding:12px}.panels{grid-template-columns:1fr}.ink{height:110px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main><header><a id="back" href="./ink-studio.html">ليالي الحبر</a><button id="language">English</button></header><h1 id="title"></h1><p id="intro"></p><nav><button id="gameTab"></button><button id="weatherTab"></button><button id="mangaTab"></button></nav><section><canvas id="scene" width="800" height="340" role="img"></canvas><p id="caption"></p></section><section id="game"><p id="brief"></p><div id="board" role="group"></div><div class="controls"><button id="undo"></button><button id="reset"></button></div><p id="status" role="status" aria-live="polite"></p></section><section id="weather" hidden><h2 id="weatherTitle"></h2><label><span id="rainLabel"></span><input id="rain" type="range" min="0" max="100" value="60"></label><label><span id="windLabel"></span><input id="wind" type="range" min="-50" max="50" value="15"></label><p id="measure"></p><button id="print"></button><p id="exportStatus" role="status"></p></section><section id="manga" hidden><h2 id="mangaTitle"></h2><p id="mangaHint"></p><div id="panels" class="panels"></div><button id="export"></button></section><small id="note"></small><noscript>تحتاج هذه التجربة JavaScript. This experience requires JavaScript.</noscript></main><script>
'use strict';
const $=id=>document.getElementById(id),query=new URLSearchParams(location.search);let lang=query.get('lang')==='en'?'en':'ar';const t=(ar,en)=>lang==='ar'?ar:en;
const walls=[7,12,17],wet=[1,6,11,16,21],start=20,letter=3,goal=24;let pos=start,steps=0,soak=0,bag=false,history=[],events=[],order=[0,1,2],active='game';
function finished(){return pos===goal&&bag||steps>=16||soak>=100}function labelCell(i){return t('خانة ','Cell ')+(i+1)+(walls.includes(i)?t('، مبنى',', building'):i===pos?t('، أنت هنا',', you are here'):i===letter&&!bag?t('، الرسالة',', letter'):i===goal?t('، السينما',', cinema'):wet.includes(i)?t('، ماء مكشوف',', exposed water'):t('، ممر مسقوف',', covered walk'));}
function move(i){if(finished()||walls.includes(i))return;const dx=Math.abs(i%5-pos%5),dy=Math.abs(Math.floor(i/5)-Math.floor(pos/5));if(dx+dy!==1)return;history.push({pos,steps,soak,bag,events:events.slice()});pos=i;steps++;soak+=wet.includes(i)?22:3;if(i===letter&&!bag){bag=true;events.push({kind:'letter',step:steps});}if(i===goal&&bag)events.push({kind:'arrival',step:steps});if((soak>=100||steps>=16)&&!(pos===goal&&bag&&soak<100))events.push({kind:'stop',step:steps});render();}
function reset(){pos=start;steps=0;soak=0;bag=false;history=[];events=[];order=[0,1,2];render();}
function show(id){active=id;for(const s of ['game','weather','manga'])$(s).hidden=s!==id;for(const s of ['game','weather','manga'])$(s+'Tab').setAttribute('aria-pressed',String(s===id));draw();}
function draw(){const c=$('scene').getContext('2d');if(!c){$('caption').textContent=t('الرسم غير متاح؛ شبكة اللعب والوصف النصي يعملان.','Artwork unavailable; the game grid and text remain available.');return;}const rain=Number($('rain').value),wind=Number($('wind').value);c.fillStyle='#16253d';c.fillRect(0,0,800,340);c.fillStyle='#cad9da';c.beginPath();c.arc(652,55,27,0,7);c.fill();for(let i=0;i<9;i++){const x=i*100,h=70+(i*37%100);c.fillStyle=i%2?'#273348':'#344258';c.fillRect(x,260-h,85,h);c.fillStyle='#e5b66f';for(let j=0;j<3;j++)c.fillRect(x+12+j*22,275-h,9,13);}c.fillStyle='#141e30';c.fillRect(0,260,800,80);c.strokeStyle='#85b4d766';for(let i=0;i<rain*2;i++){const x=(i*137)%800,y=(i*61)%330;c.beginPath();c.moveTo(x,y);c.lineTo(x+wind*.4,y+17);c.stroke();}const x=65+(pos%5)*150,y=230+Math.floor(pos/5)*9;c.fillStyle='#e9d3b9';c.beginPath();c.arc(x,y-49,12,0,7);c.fill();c.fillStyle='#101522';c.beginPath();c.moveTo(x-14,y-49);c.lineTo(x-9,y-67);c.lineTo(x+15,y-58);c.lineTo(x+10,y-45);c.fill();c.fillStyle='#d17c62';c.beginPath();c.moveTo(x-12,y-35);c.lineTo(x+12,y-35);c.lineTo(x+22,y+8);c.lineTo(x-23,y+8);c.fill();c.strokeStyle='#111';c.lineWidth=7;c.beginPath();c.moveTo(x-8,y+8);c.lineTo(x-15,y+29);c.moveTo(x+9,y+8);c.lineTo(x+17,y+29);c.stroke();if(bag){c.fillStyle='#f4e5c4';c.fillRect(x+11,y-19,22,14);}const text=t('ساعٍ بمعطف مرجاني تحت المطر، وخلفه سينما المرفأ. موضعه: ','A courier in a coral coat beneath the rain, with Harbour Cinema behind them. Position: ')+(pos+1);$('scene').setAttribute('aria-label',text);$('caption').textContent=text;$('measure').textContent=t('كثافة المطر: ','Rain density: ')+rain+'/100 · '+t('انحراف الخطوط: ','Streak offset: ')+(wind*.4).toFixed(1)+t(' بكسل. الإعدادات بصرية ولا تغيّر نتيجة الجولة.',' px. Visual settings do not change the round outcome.');}
function cards(){return [{symbol:'▥',text:t('خرج الساعي من المحطّة والسينما تنتظر الرسالة.','The courier left the station; the cinema was waiting for the letter.')},{symbol:bag?'✉':'…',text:bag?t('التقطت الرسالة في الخطوة ','You collected the letter at step ')+events.find(e=>e.kind==='letter').step:t('لم تلتقط الرسالة بعد. أكمل الجولة لتكتب هذه اللوحة.','No letter collected yet. Continue playing to write this panel.')},{symbol:finished()?'▣':'…',text:pos===goal&&bag&&soak<100?t('وصلت الرسالة. بدأ العرض بعد ','The letter arrived. The screening began after ')+steps+t(' خطوة.',' steps.'):finished()?t('انتهت المحاولة قبل تسليم رسالة جافة.','The attempt ended before a dry letter was delivered.'):t('النهاية لم تحدث بعد؛ لن نخترعها.','The ending has not happened yet; it will not be invented.')}];}
function renderPanels(){const all=cards();$('panels').replaceChildren();order.forEach((n,index)=>{const panel=document.createElement('article');panel.className='panel';const art=document.createElement('div');art.className='ink';art.textContent=all[n].symbol;art.setAttribute('aria-hidden','true');const text=document.createElement('p');text.textContent=all[n].text;const b=document.createElement('button');b.textContent=t('بدّل مع اللوحة التالية','Swap with next panel');b.disabled=index===2;b.onclick=()=>{[order[index],order[index+1]]=[order[index+1],order[index]];renderPanels();$('panels').children[index+1].querySelector('button').focus();};panel.append(art,text,b);$('panels').append(panel);});}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=t('ساعي المطر · RAVEN','Rain Courier · RAVEN');const copy={title:['ساعي المطر','Rain Courier'],intro:['لعبة قصيرة ومحاكاة طقس وصفحة مانجا من الجولة نفسها. عالم تدريب مستقل في مدينة ساحلية.','A short game, a weather sketch and a manga page from your own round. An independent coastal training world.'],back:['ليالي الحبر','Ink Nights'],gameTab:['العب','Play'],weatherTab:['ارسم المطر','Sketch the rain'],mangaTab:['مانجا جولتي','My manga'],brief:['التقط الرسالة في الخانة ٤ ثم أوصلها إلى السينما في ٢٥. اختر خانة مجاورة أو استخدم الأسهم داخل الشبكة. لديك ١٦ حركة؛ الممر المسقوف يزيد البلل ٣ والماء ٢٢. ابقَ تحت ١٠٠.','Collect the letter in cell 4, then deliver it to the cinema in 25. Choose an adjacent cell or use arrow keys within the grid. You have 16 moves; covered walks add 3 wetness, exposed water 22. Stay below 100.'],undo:['تراجع خطوة','Undo a step'],reset:['جولة جديدة','New round'],weatherTitle:['محاكاة خطوط المطر','Rain-streak simulator'],rainLabel:['كثافة المطر','Rain density'],windLabel:['اتجاه الريح','Wind direction'],print:['نزّل الكادر PNG','Download frame PNG'],mangaTitle:['ثلاث لوحات من محاولتك','Three panels from your attempt'],mangaHint:['بدّل ترتيب اللوحات لتجرب سردًا مختلفًا. النص مأخوذ من أحداث جولتك فقط.','Reorder the panels to try another narrative. Text uses only your actual round events.'],export:['نزّل أحداث المانجا JSON','Download manga events JSON'],note:['رسوم متجهية أصلية مبسطة، وليست فيديو أنمي مولّدًا. بلا ميكروفون أو اتصال ذكاء اصطناعي أو حفظ دائم. إعادة تحميل الصفحة تمسح الجولة.','Original simplified vector artwork, not generated anime video. No microphone, AI connection or persistent storage. Reloading clears the round.']};for(const [id,pair]of Object.entries(copy))$(id).textContent=t(...pair);$('language').textContent=lang==='ar'?'English':'العربية';$('back').href='./ink-studio.html?lang='+lang;const focused=document.activeElement?.dataset?.cell;$('board').replaceChildren();for(let i=0;i<25;i++){const b=document.createElement('button');b.type='button';b.dataset.cell=i;b.textContent=(i+1)+' '+(i===pos?t('أنت','You'):walls.includes(i)?'▧':i===letter&&!bag?'✉':i===goal?'▣':wet.includes(i)?'≈':'·');b.setAttribute('aria-label',labelCell(i));b.setAttribute('aria-current',String(i===pos));b.disabled=walls.includes(i)||finished();b.className=walls.includes(i)?'wall':'';b.onclick=()=>move(i);$('board').append(b);}if(focused!==undefined&&!finished())$('board').querySelector('[data-cell="'+pos+'"]').focus();$('undo').disabled=!history.length;const win=pos===goal&&bag&&soak<100;$('status').textContent=t('الحركات: ','Moves: ')+steps+'/16 · '+t('البلل: ','Wetness: ')+soak+'/100 · '+(win?t('وصلت الرسالة! افتح مانجا جولتك.','Delivered! Open your manga.'):finished()?t('انتهت المحاولة. تراجع أو ابدأ من جديد.','Attempt ended. Undo or restart.'):bag?t('الرسالة معك. اتجه للسينما.','Letter collected. Head for the cinema.'):t('ابحث عن الرسالة.','Find the letter.'));renderPanels();show(active);}
$('board').addEventListener('keydown',e=>{const delta={ArrowUp:-5,ArrowDown:5,ArrowLeft:-1,ArrowRight:1}[e.key];if(delta===undefined)return;e.preventDefault();const n=pos+delta;if(n>=0&&n<25)move(n);});$('undo').onclick=()=>{const s=history.pop();if(s){({pos,steps,soak,bag,events}=s);render();}};$('reset').onclick=reset;$('language').onclick=()=>{lang=lang==='ar'?'en':'ar';render();};for(const id of ['game','weather','manga'])$(id+'Tab').onclick=()=>show(id);for(const id of ['rain','wind'])$(id).oninput=draw;
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}$('print').onclick=()=>{try{$('scene').toBlob(blob=>{if(blob)download(blob,'raven-rain-courier.png');else $('exportStatus').textContent=t('تعذر إنشاء الصورة.','Could not create image.');});}catch{$('exportStatus').textContent=t('تنزيل الصورة غير متاح.','Image download unavailable.');}};$('export').onclick=()=>download(new Blob([JSON.stringify({format:'raven-rain-manga-1',steps,soak,bag,pos,events,panels:order.map(n=>cards()[n].text)},null,2)],{type:'application/json'}),'raven-rain-manga.json');render();
</script></body></html>
