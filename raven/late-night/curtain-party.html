<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حفلة خلف الستارة · آخر الليل</title><meta name="description" content="ثلاث إشارات: ستارة ومصباح وموسيقي. حرّك التوقيت من افتتاح متردد إلى دخول مفاجئ. النتيجة وصف نسختك."><style>body{margin:0;background:#10141a;color:#f2e9d8;font-family:system-ui,Tahoma,Arial}.wrap{max-width:680px;margin:auto;padding:16px}a.back{color:#ffd27a;text-decoration:none;font-size:14px}.box{background:#1c222b;border:1px solid #4a3f2a;border-radius:14px;padding:16px;margin-top:12px;box-shadow:0 0 24px #0008}button{background:#ffd27a;border:0;border-radius:10px;padding:12px 16px;font-size:16px;margin:4px;cursor:pointer;color:#221a08}button.ghost{background:#2b3442;color:#fff}button:disabled{opacity:.4}#msg{min-height:28px;color:#ffd27a;margin-top:8px}.hero{border-radius:14px;padding:18px;background:linear-gradient(135deg,#0e2a3a,#3a2a12);border:1px solid #8a6f3a}.art{font-size:44px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.card{background:#1c222b;border:1px solid #4a3f2a;border-radius:12px;padding:12px;color:#f2e9d8;text-decoration:none}.card small{opacity:.7}input,select{padding:10px;border-radius:8px;margin:4px}input[type=range]{width:100%}.slot{min-height:48px;border:2px dashed #776;padding:8px;border-radius:10px;margin:6px 0}.pill{display:inline-block;background:#2b3442;border-radius:20px;padding:6px 12px;margin:2px;font-size:14px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #4a3f2a;padding:6px;font-size:14px}</style></head><body><div class="wrap"><a class="back" href="./index.html">→ آخر الليل · كل التجارب</a><div class="hero"><div class='art'>🎭</div><h1>حفلة خلف الستارة</h1><p style="opacity:.8" lang="en" dir="ltr">Party behind the curtain</p><p>ثلاث إشارات: ستارة ومصباح وموسيقي. حرّك التوقيت من افتتاح متردد إلى دخول مفاجئ. النتيجة وصف نسختك.</p><p style="opacity:.7" lang="en" dir="ltr">Move 3 cue times. Result describes your version. Backstage toggle after viewing.</p><span class="pill">ادخل مشهدًا</span> <span class="pill">≈ 3 د</span></div><div class="box"><label>ستارة <input type="range" id="a" min="0" max="10" value="2"></label><label>مصباح <input type="range" id="b" min="0" max="10" value="4"></label><label>موسيقي <input type="range" id="c" min="0" max="10" value="6"></label><button onclick="go()">افتح الليلة 🎬</button><button class="ghost" onclick="back()">كواليس الإشارات</button><div id="msg"></div></div><div class="box"><a href="./index.html"><button class="ghost">كل التجارب</button></a> <button class="ghost" onclick="location.reload()">إعادة</button> <span id="nx"></span></div></div><script>function go(){var a=+document.getElementById('a').value,b=+document.getElementById('b').value,c=+document.getElementById('c').value;var m=document.getElementById('msg');m.textContent='اشتغل الضوء '+(b<a?('قبل الستارة بـ '+(a-b)+'ث'):('بعد الستارة بـ '+(b-a)+'ث'))+' ودخل الموسيقي عند '+c+'ث '+(c-a<2?'— دخول مفاجئ ✔':'— افتتاح متردد');}function back(){document.getElementById('msg').textContent+=' | كواليس: A ستارة B مصباح C موسيقي';}
var ORDER=["station-shadow","reel-run","last-minute-auction","lost-and-found","dome-sky","echo-two","echo-last-seat","darkroom-minute","weightless-cam","tide-harbor","fabric-wind","director-sentence","reading-actor","city-radio","puzzle-owner","replay-caller","memory-lift","seven-windows","curtain-party","sound-museum","time-door","three-evening","my-notebook","festival-chair","idea-to-studio","dialogue-preview","episode-ends","behind-frame","coast-map","night-tests"];
(function(){var i=ORDER.indexOf("curtain-party");var n=ORDER[(i+1)%ORDER.length];document.getElementById('nx').innerHTML='<button onclick="location.href=\'./'+n+'.html\'">التالي →</button>';})();</script></body></html>
