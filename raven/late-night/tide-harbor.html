<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرفأ المدّ والجزر · آخر الليل</title><meta name="description" content="منحنى ماء 90 ثانية. اختر الانطلاق وارتفاع الشاشة والمرسى. قد لا تمر تحت القوس أو تفوت الافتتاح."><style>body{margin:0;background:#10141a;color:#f2e9d8;font-family:system-ui,Tahoma,Arial}.wrap{max-width:680px;margin:auto;padding:16px}a.back{color:#ffd27a;text-decoration:none;font-size:14px}.box{background:#1c222b;border:1px solid #4a3f2a;border-radius:14px;padding:16px;margin-top:12px;box-shadow:0 0 24px #0008}button{background:#ffd27a;border:0;border-radius:10px;padding:12px 16px;font-size:16px;margin:4px;cursor:pointer;color:#221a08}button.ghost{background:#2b3442;color:#fff}button:disabled{opacity:.4}#msg{min-height:28px;color:#ffd27a;margin-top:8px}.hero{border-radius:14px;padding:18px;background:linear-gradient(135deg,#0e2a3a,#3a2a12);border:1px solid #8a6f3a}.art{font-size:44px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.card{background:#1c222b;border:1px solid #4a3f2a;border-radius:12px;padding:12px;color:#f2e9d8;text-decoration:none}.card small{opacity:.7}input,select{padding:10px;border-radius:8px;margin:4px}input[type=range]{width:100%}.slot{min-height:48px;border:2px dashed #776;padding:8px;border-radius:10px;margin:6px 0}.pill{display:inline-block;background:#2b3442;border-radius:20px;padding:6px 12px;margin:2px;font-size:14px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #4a3f2a;padding:6px;font-size:14px}</style></head><body><div class="wrap"><a class="back" href="./index.html">→ آخر الليل · كل التجارب</a><div class="hero"><div class='art'>⛵</div><h1>مرفأ المدّ والجزر</h1><p style="opacity:.8" lang="en" dir="ltr">Tide harbor</p><p>منحنى ماء 90 ثانية. اختر الانطلاق وارتفاع الشاشة والمرسى. قد لا تمر تحت القوس أو تفوت الافتتاح.</p><p style="opacity:.7" lang="en" dir="ltr">90-second water curve. Small screen + delayed trip are both valid in one scenario.</p><span class="pill">شغّل المحاكاة</span> <span class="pill">≈ 5 د</span></div><div class="box"><label>انطلاق (ث) <input type="range" id="d" min="0" max="90" value="20"></label><label>ارتفاع الشاشة <input type="range" id="h" min="2" max="10" value="6"></label><button onclick="go()">اعبر القوس</button><div id="msg"></div></div><div class="box"><a href="./index.html"><button class="ghost">كل التجارب</button></a> <button class="ghost" onclick="location.reload()">إعادة</button> <span id="nx"></span></div></div><script>function go(){var d=+document.getElementById('d').value,h=+document.getElementById('h').value;var water=5+4*Math.sin(d/90*6.28);var pass=(water+h<11);var open=(d>10&&d<60);var m=document.getElementById('msg');m.textContent='الماء '+water.toFixed(1)+'م + شاشة '+h+'م = '+(water+h).toFixed(1)+'م (القوس 11م) — '+(pass?'تمر ✔':'لا تمر')+' | '+(open?'تلحق الافتتاح ✔':'تفوت الافتتاح')+' — الحلان: تصغير الشاشة أو تأخير الرحلة';}
