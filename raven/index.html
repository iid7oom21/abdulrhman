<noscript><h1>RAVEN — قصص سينمائية أصلية</h1><a href="./content.html">افتح الصفحة</a></noscript>
<script>
(() => {
  const button = document.getElementById('intro-toggle');
  const video = document.getElementById('intro-video');
  const music = document.getElementById('site-soundtrack');
  const musicToggle = document.getElementById('music-toggle');
  if (!button || !video) return;
  const playLabel = 'تشغيل الإنترو';
  const stopLabel = 'إيقاف الإنترو';
  const failLabel = 'تعذر تشغيل الإنترو. اضغط مرة ثانية.';
  function setPlaying(on) {
    button.setAttribute('aria-pressed', on ? 'true' : 'false');
    button.textContent = on ? stopLabel : playLabel;
  }
  button.addEventListener('click', () => {
    if (!video.paused && !video.ended) {
      video.pause();
      setPlaying(false);
      return;
    }
    if (music && !music.paused && musicToggle) musicToggle.click();
    video.hidden = false;
    const pending = video.play();
    if (pending && typeof pending.then === 'function') {
      pending.then(() => setPlaying(true)).catch(() => { button.textContent = failLabel; });
    } else setPlaying(true);
  });
  video.addEventListener('pause', () => { if (video.ended || video.paused) setPlaying(false); });
  video.addEventListener('ended', () => setPlaying(false));
})();
</script>
