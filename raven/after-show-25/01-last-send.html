<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آخر إرسال</title><style>body{margin:0;background:#151a1c;color:#f2ece1;font-family:system-ui,Tahoma,Arial}.wrap{max-width:640px;margin:auto;padding:16px}a.back{color:#ffd27a;text-decoration:none}button{background:#ffd27a;border:0;border-radius:10px;padding:12px 16px;font-size:16px;margin:4px;cursor:pointer}button.ghost{background:#2f3a3e;color:#fff}.box{background:#222a2d;border:1px solid #3a4549;border-radius:14px;padding:16px;margin-top:12px}.shot{background:#0f3a3a;border:1px solid #ffd27a;border-radius:10px;padding:10px;margin:6px 0}.slot{min-height:50px;border:2px dashed #556;padding:8px;border-radius:10px;margin:6px 0}#msg{min-height:28px;color:#ffd27a}input[type=range]{width:100%}</style></head><body><div class="wrap"><a class="back" href="./index.html">كل التجارب</a><h1>آخر إرسال</h1><p style="opacity:.75">مونتاج 12 ثانية - تجربة 1 من 25</p><div class="box"><p>التكليف: عرفني بالمكان، ورني الفعل، واختم بأثره خلال 12 ثانية.</p><div id="lib"></div><div class="slot" id="t0">خانة 1</div><div class="slot" id="t1">خانة 2</div><div class="slot" id="t2">خانة 3</div><button onclick="play()">اعرض نسختي</button> <button class="ghost" onclick="undo()">تراجع</button><div id="stage"></div><div id="msg"></div></div><div class="box"><a href="./index.html"><button class="ghost">كل التجارب</button></a> <button class="ghost" onclick="location.reload()">اعادة</button> <span id="nx"></span></div></div><script>var SHOTS=[{id:'exterior',t:'واجهة 5ث',s:5,f:'مكان'},{id:'hand',t:'يد 4ث',s:4,f:'فعل'},{id:'envelope',t:'ظرف 3ث',s:3,f:'اثر'},{id:'lamp',t:'مصباح 6ث',s:6,f:'اثر2'}];var sel=[],hist=[],pick=null;function render(){var l=document.getElementById('lib');l.innerHTML='';SHOTS.forEach(function(sh){var d=document.createElement('div');d.className='shot';d.textContent=sh.t+' '+sh.s+'ث '+sh.f;d.onclick=function(){pick=sh.id;document.getElementById('msg').textContent='اخترت '+sh.t+' المس خانة';};l.appendChild(d);});}render();function draw(){for(var k=0;k<3;k++){document.getElementById('t'+k).textContent=sel[k]||('خانة '+(k+1));}}draw();for(var k=0;k<3;k++){(function(k){document.getElementById('t'+k).onclick=function(){if(pick&&sel.length<3){hist.push(sel.slice());sel.splice(k,0,pick);if(sel.length>3)sel.pop();draw();}};})(k);}function undo(){if(hist.length){sel=hist.pop();draw();}}function play(){var tot=0,fs=[];sel.forEach(function(id){var sh=SHOTS.filter(function(x){return x.id==id})[0];tot+=sh.s;fs.push(sh.f);});var m=document.getElementById('msg');if(sel.length<3){m.textContent='ركب 3 لقطات';return;}var ok=(tot<=12&&fs.indexOf('مكان')>=0&&fs.indexOf('فعل')>=0);m.textContent='نسختك '+tot+' ثانية '+(ok?'ممتاز ✔':'تحتاج مكان ثم فعل ثم اثر ضمن 12');document.getElementById('stage').textContent='يعرض: '+sel.join(' > ');}
var ORDER=['01-last-send', '02-shift', '03-light', '04-foley', '05-archive', '06-continuity', '07-budget', '08-duo', '09-daily', '10-night', '11-brief', '12-tweak', '13-board', '14-subs', '15-sound', '16-fast-cut', '17-memory', '18-rhythm', '19-shadow', '20-fx-time', '21-sort', '22-rehearsal', '23-map', '24-curtain', '25-picker'];
(function(){var i=ORDER.indexOf('01-last-send');var n=ORDER[(i+1)%ORDER.length];document.getElementById('nx').innerHTML='<button onclick="location.href=\'./'+n+'.html\'">التالي</button>';})();
</script></body></html>
