<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ميزانية اللقطة</title><style>body{margin:0;background:#151a1c;color:#f2ece1;font-family:system-ui,Tahoma,Arial}.wrap{max-width:640px;margin:auto;padding:16px}a.back{color:#ffd27a;text-decoration:none}button{background:#ffd27a;border:0;border-radius:10px;padding:12px 16px;font-size:16px;margin:4px;cursor:pointer}button.ghost{background:#2f3a3e;color:#fff}.box{background:#222a2d;border:1px solid #3a4549;border-radius:14px;padding:16px;margin-top:12px}.shot{background:#0f3a3a;border:1px solid #ffd27a;border-radius:10px;padding:10px;margin:6px 0}.slot{min-height:50px;border:2px dashed #556;padding:8px;border-radius:10px;margin:6px 0}#msg{min-height:28px;color:#ffd27a}input[type=range]{width:100%}</style></head><body><div class="wrap"><a class="back" href="./index.html">كل التجارب</a><h1>ميزانية اللقطة</h1><p style="opacity:.75">10 وحدات - تجربة 7 من 25</p><div class="box"><p>معك 10 وحدات. تحتاج حوار + مكان.</p><div id="o"></div><p>متبقي <b id="l">10</b></p><div id="msg"></div></div><div class="box"><a href="./index.html"><button class="ghost">كل التجارب</button></a> <button class="ghost" onclick="location.reload()">اعادة</button> <span id="nx"></span></div></div><script>var left=10,got={};var IT=[['ميكروفون 4','mic',4],['مكان 3','place',3],['اضاءة 4','light',4],['موسيقى 2','mus',2]];function dr(){var o=document.getElementById('o');o.innerHTML='';IT.forEach(function(it){var b=document.createElement('button');b.textContent=(got[it[1]]?'✔ ':'+ ')+it[0];b.onclick=function(){if(got[it[1]]){left+=it[2];delete got[it[1]];}else{if(left<it[2]){document.getElementById('msg').textContent='تجاوزت!';return;}left-=it[2];got[it[1]]=1;}document.getElementById('l').textContent=left;ck();};o.appendChild(b);});}function ck(){document.getElementById('msg').textContent=(got['mic']&&got['place'])?'عرضك يغطي المطلوب ✔ صرفت '+(10-left):'تحتاج ميكروفون + مكان';}dr();ck();
var ORDER=['01-last-send', '02-shift', '03-light', '04-foley', '05-archive', '06-continuity', '07-budget', '08-duo', '09-daily', '10-night', '11-brief', '12-tweak', '13-board', '14-subs', '15-sound', '16-fast-cut', '17-memory', '18-rhythm', '19-shadow', '20-fx-time', '21-sort', '22-rehearsal', '23-map', '24-curtain', '25-picker'];
(function(){var i=ORDER.indexOf('07-budget');var n=ORDER[(i+1)%ORDER.length];document.getElementById('nx').innerHTML='<button onclick="location.href=\'./'+n+'.html\'">التالي</button>';})();
</script></body></html>
