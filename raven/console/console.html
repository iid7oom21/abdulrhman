<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAVEN · كونسول Gemini</title><link rel="stylesheet" href="./css/raven.css"></head><body>
<header><span class="brand">RAVEN</span><nav><a href="./console.html" class="on">الكونسول</a><a href="./dashboard.html" >اللوحة</a><a href="../">الموقع</a></nav><span class="spacer"></span><span id="keyBadge" class="meta"></span><button id="openSettings">الإعدادات</button></header>
<main class="cols">
<section class="card"><h2>البرومبت</h2>
<select id="promptPick"></select>
<label>الموديل</label><input id="model" class="ltr" list="models"><datalist id="models"><option>gemini-2.5-flash</option><option>gemini-2.5-pro</option><option>gemini-2.5-flash-lite</option><option>gemini-2.0-flash</option></datalist>
<label>تعليمات النظام</label><textarea id="system"></textarea>
<label>Temperature <span id="tV"></span></label><input id="temperature" type="range" min="0" max="2" step="0.05">
<label>Top P <span id="pV"></span></label><input id="topP" type="range" min="0" max="1" step="0.01">
<div class="row"><div><label>Top K</label><input id="topK" type="number" min="1"></div><div><label>أقصى توكنز</label><input id="maxOutputTokens" type="number" min="1"></div></div>
<label><input id="stream" type="checkbox" style="width:auto" checked> بث مباشر (stream)</label>
</section>
<section style="display:grid;gap:18px">
<div class="card"><h2>السؤال</h2><textarea id="query" placeholder="اكتب سؤالك…"></textarea>
<div class="row" style="margin-top:10px"><button class="primary" id="send">إرسال</button><button id="stop" disabled>إيقاف</button><button id="copy">نسخ الرد</button><button id="export">تصدير JSON</button></div></div>
<div class="card"><h2>الرد <span id="stats" class="meta"></span></h2><div id="out" class="out"></div><div id="error"></div></div>
<div class="card"><h2>فاحص الطلب / الرد</h2><div class="row"><div><div class="meta">Request</div><pre id="reqJson">—</pre></div><div><div class="meta">Response</div><pre id="resJson">—</pre></div></div></div>
<div class="card"><h2>السجل</h2><ul id="history" class="list"></ul><button id="clearHist" style="margin-top:8px">مسح السجل</button></div>
</section></main>
<script type="module" src="./js/console.js"></script></body></html>
