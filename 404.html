<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>الصفحة غير موجودة — RAVEN</title>
<link rel="icon" href="/abdulrhman/raven/terminal-preview/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Plex";font-weight:400 700;font-display:swap;src:url("/abdulrhman/raven/terminal-preview/assets/ibm-plex-arabic.woff2") format("woff2")}
@font-face{font-family:"Cinzel";font-weight:500 700;font-display:swap;src:url("/abdulrhman/raven/terminal-preview/assets/cinzel.woff2") format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080a0b;color:#eee8de}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Plex",system-ui,sans-serif;line-height:1.8;background:radial-gradient(ellipse at 50% 30%,#1a1f20 0%,#080a0b 70%)}
main{max-width:520px;text-align:center}
.brand{font-family:"Cinzel",serif;letter-spacing:.3em;font-size:14px;color:#b9b1a4;margin:0 0 8px}
h1{font-size:clamp(28px,6vw,40px);margin:0 0 12px;font-weight:700}
p{font-size:16px;color:#d6cfc3;margin:0 0 28px}
a{display:inline-block;min-height:44px;padding:10px 28px;border:1px solid #eee8de;color:#eee8de;text-decoration:none;font-size:16px;border-radius:2px}
a:hover,a:focus-visible{background:#eee8de;color:#080a0b;outline:none}
</style>
</head>
<body>
<main>
<p class="brand">RAVEN</p>
<h1>هذا الأثر انمحى</h1>
<p>الصفحة اللي تدورها غير موجودة أو انتقلت لمكان ثاني.</p>
<a href="/abdulrhman/raven/">ارجع لـ RAVEN</a>
</main>
</body>
</html>
