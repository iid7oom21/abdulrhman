name: Play the published After the Show round

on:
  push:
    branches: [main]
    paths:
      - deploy/render/build.mjs
      - deploy/render/pages-smoke.py
      - deploy/render/late-night-smoke.py
      - .github/workflows/after-show-pages-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-round:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Read smoke sources and the pinned Pages object
        shell: bash
        run: |
          git init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --no-recurse-submodules --depth=1 origin "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          mkdir -p deploy/render
          for source in deploy/render/build.mjs deploy/render/pages-smoke.py deploy/render/late-night-smoke.py; do
            git show "$GITHUB_SHA:$source" > "$source"
          done
          pin=$(sed -nE "s/^export const SITE_COMMIT = '([0-9a-f]{40})';$/\1/p" deploy/render/build.mjs)
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --no-recurse-submodules --depth=1 origin "$pin"
          test "$(git rev-parse FETCH_HEAD)" = "$pin"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Play a round on GitHub Pages in Chrome
        run: python deploy/render/pages-smoke.py
      - name: Cross with the shadow and screen an edited director scene
        run: python deploy/render/late-night-smoke.py
      - name: Keep Late Night mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-late-night-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/late-night-play/
          if-no-files-found: warn
          retention-days: 14
      - name: Keep the browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-round-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/after-show-pages/
          if-no-files-found: warn
          retention-days: 14
